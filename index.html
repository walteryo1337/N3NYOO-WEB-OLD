<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="N3NYOO has moved. Join our Discord community for updates and support.">
  <title>We've moved | N3NYOO</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090916;
      color: #f4f1ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 50% 20%, rgba(129, 85, 255, .22), transparent 42%),
        linear-gradient(145deg, #0d0b1e 0%, #090916 70%);
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 56px);
      border: 1px solid rgba(190, 169, 255, .2);
      border-radius: 24px;
      background: rgba(24, 20, 44, .84);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #bda8ff;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 9vw, 4.8rem);
      line-height: 1.05;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 440px;
      margin: 22px auto 0;
      color: #cbc6dc;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid rgba(190, 169, 255, .28);
      border-radius: 12px;
      color: #f4f1ff;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .2s ease, transform .2s ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid #d4c6ff; outline-offset: 3px; }
    .button.primary { border-color: #a886ff; background: #8257e5; }
    .button.primary:hover { background: #986ff5; }
    @media (max-width: 440px) {
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">N3NYOO</p>
    <h1>We've moved.</h1>
    <p class="intro">Our community has moved. Join us on Discord for the latest updates and support.</p>
    <div class="actions">
      <a class="button primary" href="https://discord.gg/YcQjSxAgvN" target="_blank" rel="noopener noreferrer">Join our Discord</a>
    </div>
  </main>
</body>
</html>
